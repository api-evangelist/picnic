name: Picnic
description: >-
  Picnic is a London-based, privacy-first photo-organization app for iOS that
  helps people declutter and organize their camera roll through a swipe-based,
  gamified experience — sorting photos into albums, comparing and removing
  duplicate shots, building streaks, and resurfacing "on this day" memories.
  All processing happens on-device, so photos never leave the user's phone:
  no cloud upload, no ads, and no tracking or selling of user data. Founded in
  2019 and a certified B Corporation, Picnic grew to more than 1.5 million users
  and roughly €4M ARR before being acquired by Paris-based mobile app publisher
  MWM in April 2026. Picnic is a consumer mobile product and publishes no public
  developer API, SDK, or documentation surface.
